<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Functional Healthcare Regions Around Idaho</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #d9d9d9;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    #info-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 320px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      z-index: 1000;
    }

    #info-panel {
      display: none;
    }

#open-panel-btn {
  position: absolute;
  top: 13%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 1200;

  padding: 18px 28px;
  font-size: 18px;
  font-weight: 600;

  color: #ffffff;
  background: linear-gradient(135deg, #2F5C3C, #3E7B52);
  border: none;
  border-radius: 14px;

  box-shadow: 0 8px 25px rgba(0,0,0,0.35);
  cursor: pointer;

  text-align: center;
  line-height: 1.3;

  transition: all 0.2s ease;
}

#open-panel-btn:hover {
  transform: translate(-50%, -50%) scale(1.05);
  box-shadow: 0 12px 30px rgba(0,0,0,0.45);
}

#open-panel-btn:active {
  transform: translate(-50%, -50%) scale(0.98);
}

.cta-sub {
  display: block;
  font-size: 13px;
  font-weight: 400;
  opacity: 0.85;
  margin-top: 4px;
}


    #close-panel-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1300;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      color: white;
      font-size: 18px;
      line-height: 28px;
      cursor: pointer;
    }

    /* =========================
   PANEL BLOCK (new)
========================= */

    .panel-block {
      background: rgba(12, 16, 28, 0.92);
      color: #e8eefc;
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);

      height: 100%;
      min-height: calc(100vh - 40px);

      border-radius: 12px;
      padding: 18px 16px;

      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* =========================
   MAP LABELS
========================= */

    .distance-label div {
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 11px;
      text-align: center;
      white-space: nowrap;
      font-weight: 600;
    }

    .hospital-label div {
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      white-space: nowrap;
      font-weight: 500;
    }

    #dt-legend {
  position: absolute;
  bottom: 20px;
  right: 20px;
  z-index: 1100;
  background: rgba(12, 16, 28, 0.85);
  color: #e8eefc;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.12);
  font-size: 13px;
  line-height: 1.4;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.legend-title {
  font-weight: 600;
  margin-bottom: 6px;
}

.legend-item {
  display: flex;
  align-items: center;
  margin-bottom: 4px;
}

.box {
  width: 14px;
  height: 14px;
  margin-right: 8px;
  border-radius: 3px;
}

.box-0 { background: #2F5C3C; }
.box-1 { background: #F4D35E; }
.box-2 { background: #EE964B; }
.box-3 { background: #D1495B; }
.box-4 { background: #C8A2FF; }

  </style>
</head>

<body>

<div id="map"></div>

<button id="open-panel-btn">
  Explore Idaho Healthcare<br>
  <span class="cta-sub">Click here to start</span>
</button>

<!-- Legend -->
<div id="dt-legend">
  <div class="legend-title">Drive Time (minutes)</div>
  <div class="legend-item"><span class="box box-0"></span> 0-30</div>
  <div class="legend-item"><span class="box box-1"></span> 30-60</div>
  <div class="legend-item"><span class="box box-2"></span> 60-90</div>
  <div class="legend-item"><span class="box box-3"></span> 90-120</div>
  <div class="legend-item"><span class="box box-4"></span> 120-150</div>
</div>

<div id="info-panel">
    <button id="close-panel-btn" type="button">&times;</button>
    <div class="panel-block">
      <strong>Find closest care</strong><br><br>

      <input id="address-input" type="text" placeholder="Enter Idaho address"
        style="width: 100%; padding: 6px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #ccc;" />

      <button id="search-btn" style="width: 100%; padding: 6px; border-radius: 6px; border: none; background: #2F5C3C;">
        Search
      </button>

      <button id="clear-btn"
        style="width: 100%; padding: 6px; margin-top: 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;">
        Clear
      </button>

      <br><br>

      <div id="search-results">
        <em>Click search to locate address</em>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <script src="js/idahohealthcareAM.js"></script>

</body>

</html>
