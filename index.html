<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Functional Healthcare Regions Around Idaho</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #d9d9d9;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    #info-panel {
  position: absolute;
  left: 14px;
  bottom: 14px;
  z-index: 1000;
  width: 300px;
  max-width: 300px;
  background: rgba(255, 255, 255, 0.94);
  border-radius: 10px;
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.35;
}
/* =========================
   PANEL BLOCK (new)
========================= */

.panel-block {
  background: rgba(12, 16, 28, 0.85);
  color: #e8eefc;
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.28);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 14px 15px;
  line-height: 1.35;
  font-size: 13px;
}

  </style>
</head>

<body>

  <div id="map"></div>

  <div id="info-panel">
  <div class="panel-block">
    <strong>Map summary</strong><br>
    Click anywhere on the map.
  </div>
</div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <script src="js/idahohealthcare.js"></script>

</body>
</html>
